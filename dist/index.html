`.jpg`, `.mp4`) dit comment ses octets doivent être lus. Les formats **compressés** (`.jpg`, `.mp4`) réduisent la taille pour stocker et transmettre plus vite.\n\nSur le réseau, un fichier est découpé en [[trame-paquet|paquets]] : ce sont toujours des octets qui circulent.",remember:[`1 octet = 8 bits = 256 valeurs (0 à 255).`,`Nombre en binaire, texte en codes de caractères, image en pixels.`,`Le format (l’extension) dit comment lire les octets d’un fichier.`],example:`Le message « BONJOUR » compte 7 caractères : 7 octets. L’adresse IP 192.168.10.1 tient sur 4 octets.`,mistakes:[{belief:`changer l’extension d’un fichier le convertit dans un autre format.`,truth:`renommer photo.png en photo.txt ne change pas ses octets : le fichier devient seulement illisible pour les logiciels.`}],inApp:"Dans l’explorateur de fichiers d’un poste, l’extension des fichiers indique leur type ; la commande `cat` affiche le contenu d’un fichier texte.",related:[`fichiers-arborescence`,`donnees-objet`,`debit`,`adresse-ip`]},{id:`objets-communicants`,title:`Deux objets qui communiquent`,aliases:[`émetteur`,`récepteur`,`message`,`radio`,`Bluetooth`,`format de message`],level:`3e`,category:`materiel`,short:`Deux objets communiquent quand l’un émet un message que l’autre reçoit et comprend, grâce à un format convenu à l’avance.`,body:`Deux cartes programmables (par exemple deux micro:bit) peuvent échanger des messages par **radio**, par **Bluetooth** ou par [[wifi|Wi-Fi]]. Dans chaque échange :

- l’**émetteur** envoie le message ;
- le **récepteur** le reçoit et le traite (afficher, allumer une LED, déclencher un moteur) ;
- un même objet peut être tour à tour émetteur et récepteur.

Pour se comprendre, les deux programmes doivent suivre les mêmes règles — c’est un petit [[protocole]] :

- le **canal** (ou groupe radio) : les deux cartes doivent écouter le même ;
- le **format du message** : par exemple \`T:21\` pour « température 21 °C », ou \`ALARME\` ;
- ce que le récepteur fait de chaque message, et éventuellement la réponse qu’il renvoie (\`OK\`).

Si l’émetteur envoie \`21\` alors que le récepteur attend \`T:21\`, le message arrive mais n’est pas compris.`,remember:[`Émetteur → message → récepteur.`,`Même canal, même format de message : on le décide avant de programmer.`,`Un message arrivé n’est pas forcément compris.`],example:`Une carte mesure la température dans la serre et envoie « T:28 » toutes les minutes ; une autre, dans la maison, reçoit le message et affiche 28 ; au-dessus de 30, elle sonne.`,mistakes:[{belief:`il suffit que les deux cartes soient allumées pour qu’elles se comprennent.`,truth:`elles doivent utiliser le même canal et le même format de message, décidés à l’avance.`}],inApp:`Deux terminaux peuvent s’échanger des lignes de texte : le récepteur ouvre le « Serveur écho » et le démarre sur un port, l’émetteur ouvre le « Client écho », se connecte à ce port et envoie son message. Le port joue le rôle du canal, et le serveur renvoie chaque ligne reçue en accusé de réception. RéseauLab ne programme pas les objets : faire réagir le récepteur (afficher, sonner) se travaille avec de vraies cartes programmables.`,related:[`objet-connecte`,`protocole`,`donnees-objet`,`wifi`]},{id:`enjeux-numerique`,title:`Infrastructures et enjeux du numérique`,aliases:[`câble sous-marin`,`data center`,`centre de données`,`souveraineté numérique`,`empreinte environnementale`,`métiers du numérique`],level:`3e`,category:`materiel`,short:`Internet repose sur des infrastructures bien réelles — câbles, routeurs, centres de données — qui consomment de l’énergie et posent des choix de société.`,body:`Internet n’est pas « dans les nuages » : il repose sur du matériel.

- **Les câbles** : presque toutes les communications entre continents (plus de 95 %) passent par des **câbles sous-marins** en fibre optique ; il en existe plusieurs centaines. Sur terre, les opérateurs relient villes et quartiers par la fibre.
- **Les centres de données (data centers)** : des bâtiments remplis de serveurs qui hébergent sites, vidéos, messageries, stockage en ligne. Ils fonctionnent jour et nuit et doivent être refroidis.
- **L’énergie et l’environnement** : les centres de données consomment de l’ordre de 1 à 2 % de l’électricité mondiale. Mais la plus grande part de l’empreinte du numérique vient de la **fabrication** de nos appareils (métaux, eau, énergie) : les garder longtemps est le geste le plus efficace.
- **La souveraineté** : un pays qui dépend de câbles, de serveurs ou de logiciels contrôlés ailleurs dépend aussi des lois et des décisions d’autres pays. Héberger ses données sur son territoire, former ses propres spécialistes en sont des réponses.
- **Les métiers** : technicien et administrateur réseau, installateur de fibre, spécialiste en cybersécurité, développeur, technicien de data center…

*Chiffres donnés en ordre de grandeur, à vérifier et actualiser par l’enseignant.*`,remember:[`Internet repose sur des câbles (dont sous-marins), des routeurs et des centres de données.`,`La fabrication des appareils pèse plus que leur utilisation : les garder longtemps.`,`Dépendre d’infrastructures étrangères pose une question de souveraineté.`],example:`Une vidéo regardée en France peut venir d’un serveur aux États-Unis : elle traverse l’Atlantique par un câble posé au fond de l’océan.`,mistakes:[{belief:`les données sont stockées « dans le cloud », sans matériel.`,truth:`le « cloud », ce sont des serveurs bien réels, dans des centres de données quelque part dans le monde.`},{belief:`les satellites transportent l’essentiel d’Internet entre les continents.`,truth:`ce sont les câbles sous-marins : ils transportent bien plus de données, plus vite.`}],related:[`chemin-internet`,`reseau-local-internet`,`debit`,`client-serveur`]}],Mr={notions:[...Ar,...jr],questions:kr,messages:{}},Nr={couches:{title:`Un message emballé couche par couche`,description:`Quatre rectangles emboîtés : la couche Liaison (adresses MAC) contient la couche Réseau (adresses IP), qui contient la couche Transport (numéro de port), qui contient la couche Application (les données).`},"adresse-ip":{title:`Les deux parties d’une adresse IP`,description:`L’adresse 192.168.1.10 avec le masque 255.255.255.0 : les trois premiers nombres, 192.168.1, désignent le réseau ; le dernier, 10, désigne l’équipement.`},"meme-reseau":{title:`Même réseau ou non ? (masque 255.255.255.0)`,description:`192.168.1.10 et 192.168.1.25 ont la même partie réseau, 192.168.1 : même réseau. 192.168.1.10 et 192.168.2.10 diffèrent sur le troisième nombre : deux réseaux différents.`},passerelle:{title:`La passerelle : le routeur, vu depuis le réseau du poste`,description:`Un poste 192.168.1.10 est relié par un switch à un routeur. Le routeur a l’adresse 192.168.1.1 du côté du poste, et 10.0.0.1 de l’autre côté, où se trouve un serveur 10.0.0.80. La passerelle du poste est 192.168.1.1.`},arp:{title:`ARP : trouver l’adresse MAC qui va avec une adresse IP`,description:`Étape 1 : le poste A demande à tous les équipements du réseau qui a l’adresse 192.168.1.20. Étape 2 : seul le poste B, qui a cette adresse, répond avec son adresse MAC. Le poste C ignore la demande.`},dns:{title:`Le DNS, puis le serveur web`,description:`Étape 1 : le poste demande au serveur DNS l’adresse de www.college.fr. Étape 2 : le serveur DNS répond 10.0.0.80. Étape 3 : le poste demande la page au serveur web 10.0.0.80.`},topologies:{title:`Cinq façons de relier les équipements`,description:`En étoile : quatre ordinateurs, chacun relié par son câble à un switch placé au centre. En arbre : un switch principal relié à deux switchs, chacun relié à deux ordinateurs. Maillée : quatre routeurs reliés par plusieurs liaisons, si bien qu’il existe plusieurs chemins de l’un à l’autre. Dans les anciens réseaux, en bus : quatre ordinateurs branchés sur un même câble qu’ils se partagent ; en anneau : cinq ordinateurs disposés en cercle, chacun relié à ses deux voisins.`},"chemin-internet":{title:`D’un routeur à l’autre jusqu’au serveur`,description:`Le message part du poste, passe par la box, puis par deux routeurs, avant d’arriver au serveur web. Chaque routeur traversé est un saut ; traceroute les affiche un par un.`}};function Pr(e){return Object.hasOwn(Nr,e)?Nr[e]:void 0}var Fr={conception:{label:`Conception`,where:`en haut de l’écran, au milieu`},simulation:{label:`Simulation`,where:`en haut de l’écran, au milieu`},palette:{label:`palette`,where:`à gauche de l’écran, en mode Conception`},cable:{label:`Câble`,where:`dans la palette, à gauche, en mode Conception`},texte:{label:`Texte`,where:`dans la palette, à gauche, en mode Conception (selon le niveau)`},zone:{label:`Zone`,where:`dans la palette, à gauche, en mode Conception (selon le niveau)`},panneau:{label:`panneau du bas`,where:`en bas de l’écran`},annuler:{label:`Annuler`,where: `,Sb=7,Cb=`<h1>Musée des réseaux</h1>
<h2>Exposition : le voyage d’une information</h2>
<p>Votre demande vient de traverser plusieurs réseaux, de routeur en routeur, pour arriver jusqu’à ce serveur.</p>
<ul>
<li>Les câbles : presque toutes les communications entre continents (plus de 95 %) passent par des câbles sous-marins en fibre optique. Il en existe plusieurs centaines.</li>
<li>Les centres de données : ce serveur est rangé avec des milliers d’autres dans un data center, allumé jour et nuit et refroidi en permanence.</li>
<li>L’énergie : les centres de données consomment de l’ordre de 1 à 2 % de l’électricité mondiale. Mais c’est la fabrication de nos appareils qui pèse le plus dans l’empreinte du numérique.</li>
<li>La souveraineté : un pays qui dépend de câbles, de serveurs ou de logiciels contrôlés ailleurs dépend aussi des décisions d’autres pays.</li>
<li>Les métiers : technicien réseau, installateur de fibre, spécialiste en cybersécurité, technicien de data center, développeur…</li>
</ul>
